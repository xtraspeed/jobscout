name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fast, fully offline defaults. No test here touches the network.
  JOBSCOUT_PER_DOMAIN_RATE: "1000"
  JOBSCOUT_LOG_LEVEL: WARNING
  JOBSCOUT_LOG_FORMAT: console

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Types
        run: mypy src scripts

      - name: Unit tests
        run: pytest -m "not integration and not network" --cov=jobscout --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobscout
          POSTGRES_PASSWORD: jobscout
          POSTGRES_DB: jobscout_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobscout -d jobscout_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      JOBSCOUT_TEST_DATABASE_URL: postgresql+asyncpg://jobscout:jobscout@localhost:5432/jobscout_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Integration tests
        run: pytest -m integration

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t jobscout:ci .

      - name: Smoke test in the image
        run: |
          docker run --rm jobscout:ci python scripts/smoke_test.py
