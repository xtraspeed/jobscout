# One image, several roles. Migrations run as a one-shot Job/service, never
# from API or worker startup: concurrent replicas racing to migrate is the
# classic way to take a production database down.

x-app: &app
  build:
    context: .
  image: jobscout:local
  env_file: [.env]
  environment:
    JOBSCOUT_DATABASE_URL: postgresql+asyncpg://jobscout:jobscout@postgres:5432/jobscout
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobscout
      POSTGRES_PASSWORD: jobscout
      POSTGRES_DB: jobscout
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscout -d jobscout"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations, then exits. Every other service waits for it.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command:
      - python
      - -m
      - uvicorn
      - jobscout.api.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1

  dashboard:
    <<: *app
    command:
      - streamlit
      - run
      - src/jobscout/dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      JOBSCOUT_DATABASE_URL: postgresql+asyncpg://jobscout:jobscout@postgres:5432/jobscout
      JOBSCOUT_DASHBOARD_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy

  # One-shot: a single crawl run, then exits. Run it on demand or on a schedule.
  crawler:
    <<: *app
    command: ["python", "-m", "jobscout.cli", "crawl", "--target", "hnhiring", "--allow-network"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["crawl"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    profiles: ["metrics"]

volumes:
  postgres-data:
  prometheus-data:
