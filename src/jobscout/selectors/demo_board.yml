# Selector config for a conventional paginated HTML job board.
#
# Adding a new board means copying this file and changing selectors -- no Python.
# Selectors use the form `<css>::text`, `<css>::html` or `<css>::attr(name)`.
#
# Before pointing this at a real site, check its robots.txt and terms of service
# and set JOBSCOUT_PER_DOMAIN_RATE to something the site can absorb comfortably.

name: demo_board
description: Generic two-level job board: paginated index plus detail pages.

start_urls:
  - https://demo-board.example/jobs

base_url: https://demo-board.example

list:
  item_selector: "div.job-card"
  url: "a.job-title::attr(href)"
  fields:
    title: "h2.job-title::text"
    company: "span.company::text"
    location: "span.location::text"
    employment_type: "span.employment-type::text"
    salary: "span.salary::text"
    summary: "p.summary::text"
    tags: "ul.tags li::text"
    posted_at: "time.posted::attr(datetime)"

detail:
  remove: "script, style, noscript, .apply"
  fields:
    # Repeat title/company on the detail page so each page can be parsed on its
    # own. This is what lets `jobscout reparse` rebuild the dataset from the
    # archive after a site redesign, without re-crawling the index.
    title: "h1::text"
    company: "span.company::text"
    description: "div.description::html"
    location: "div.details span.location::text"
    salary: "div.details span.salary::text"
    employment_type: "div.details span.employment-type::text"
    posted_at: "time.posted::attr(datetime)"
    tags: "ul.skills li::text"

pagination:
  max_pages: 3
  page_query_param: page

infer_remote: true
infer_employment_type: true
