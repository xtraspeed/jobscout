[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobscout"
version = "0.1.0"
description = "Async, production-shaped web scraping platform for public job listings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashish" }]
keywords = ["scraping", "asyncio", "httpx", "crawler", "fastapi", "streamlit"]

dependencies = [
  "httpx[http2]>=0.27",
  "selectolax>=0.3.21",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
  "streamlit>=1.36",
  "pandas>=2.2",
  "altair>=5.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyyaml>=6.0",
]

[project.scripts]
jobscout = "jobscout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscout"]

[tool.hatch.build.targets.wheel.force-include]
"src/jobscout/selectors" = "jobscout/selectors"

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "C4",  # comprehensions
  "UP",  # pyupgrade
  "ASYNC", # flake8-async
  "S",   # bandit
  "RUF",
]
ignore = [
  "E501",    # line length is handled by the formatter
  "S101",    # assert is fine (used deliberately in tests)
  "B008",
  "RUF001",  # ambiguous unicode: legitimately used in fixtures
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"alembic/*" = ["E402"]
"scripts/*" = ["S311", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["jobscout"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = false
show_error_codes = true
pretty = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = [
  "selectolax.*",
  "streamlit.*",
  "altair.*",
  "pandas.*",
  "uvicorn.*",
  "respx.*",
]
ignore_missing_imports = true

# ------------------------------------------------------------------ tests ---

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires a live PostgreSQL (set JOBSCOUT_TEST_DATABASE_URL)",
  "network: hits the live public internet",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["jobscout"]
omit = ["*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
